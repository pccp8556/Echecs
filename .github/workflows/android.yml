name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le paquet « tools » (installé par défaut par l'action) n'existe plus : liste explicite.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: APK de débogage
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: paul-aurait-trouve-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # APK / AAB signés si les secrets de signature sont configurés (voir docs/ANDROID.md).
      - name: Signature de publication
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: paul-aurait-trouve-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
